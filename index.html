<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Globe Real-Time | 2026</title>
    <style>
        :root { --bg: #0f1113; --card: #1c1e21; --accent: #2ecc71; --text: #ffffff; --dim: #a0a0a0; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        /* Navigation */
        .header { padding: 15px 20px; display: flex; align-items: center; background: rgba(15,17,19,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; }
        .header h1 { flex-grow: 1; font-size: 18px; text-transform: uppercase; letter-spacing: 2px; margin: 0; text-align: center; }
        .menu-btn, .search-toggle { background: none; border: none; color: white; font-size: 22px; cursor: pointer; padding: 5px; }

        /* Sidebar */
        .sidebar { position: fixed; left: -300px; top: 0; width: 260px; height: 100%; background: var(--card); z-index: 200; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 10px 0 30px rgba(0,0,0,0.5); padding: 30px 20px; }
        .sidebar.open { left: 0; }
        .sidebar h2 { font-size: 24px; color: var(--accent); margin-bottom: 30px; }
        .nav-item { padding: 15px 0; border-bottom: 1px solid #333; cursor: pointer; color: var(--dim); transition: 0.3s; }
        .nav-item:hover { color: white; padding-left: 10px; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; z-index: 150; }

        /* Search Bar */
        .search-box { padding: 10px 20px; background: #25282c; display: none; }
        .search-box input { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #3a3f44; color: white; outline: none; }

        /* Feed */
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .section-title { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        
        .post { background: var(--card); border-radius: 16px; margin-bottom: 25px; overflow: hidden; animation: fadeInUp 0.5s ease both; }
        .post img { width: 100%; height: 300px; object-fit: cover; }
        .post-content { padding: 20px; }
        .badge { background: var(--accent); color: black; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; margin-bottom: 10px; display: inline-block; }
        .post h3 { margin: 0 0 10px 0; font-size: 20px; line-height: 1.3; }
        .post p { color: var(--dim); font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        
        .post-actions { display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid #333; }
        .like-btn { cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--dim); }
        .like-btn.active { color: #e74c3c; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        #loader { text-align: center; padding: 40px; }
        .spinner { border: 3px solid #333; border-top: 3px solid var(--accent); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="sidebar" class="sidebar">
        <h2>DAILY GLOBE</h2>
        <div class="nav-item" onclick="refreshWithTopic('Tech')">Technology</div>
        <div class="nav-item" onclick="refreshWithTopic('Sport')">Sports</div>
        <div class="nav-item" onclick="refreshWithTopic('Cars')">Automotive</div>
        <div class="nav-item" onclick="refreshWithTopic('Cooking')">Culinary</div>
        <div class="nav-item" onclick="resetAlgo()" style="color: #e74c3c; margin-top: 50px;">Reset Algorithm</div>
    </div>
    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h1>Daily Globe <span style="font-size: 10px; vertical-align: middle; color: var(--accent);">● LIVE</span></h1>
        <button class="search-toggle" onclick="toggleSearch()">🔍</button>
    </div>

    <div id="searchBox" class="search-box">
        <input type="text" id="searchInput" placeholder="Search real news..." onkeypress="handleSearch(event)">
    </div>

    <div class="container" id="feed">
        <div id="loader">
            <div class="spinner"></div>
            <p>Syncing with 2026 News Feeds...</p>
        </div>
    </div>

<script>
    // --- APP STATE & ALGORITHM ---
    // Tracks likes to weight news recommendations
    let algoWeights = JSON.parse(localStorage.getItem('dg_weights') || '{"Tech":1, "Sport":1, "Cars":1, "Cooking":1}');
    
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').style.display = document.getElementById('sidebar').classList.contains('open') ? 'block' : 'none';
    }

    function toggleSearch() {
        const sb = document.getElementById('searchBox');
        sb.style.display = sb.style.display === 'block' ? 'none' : 'block';
    }

    function resetAlgo() { localStorage.clear(); location.reload(); }

    function handleSearch(e) {
        if(e.key === 'Enter') {
            const query = document.getElementById('searchInput').value;
            generateRealNews(query);
        }
    }

    function refreshWithTopic(t) {
        toggleMenu();
        generateRealNews(t);
    }

    // --- REAL DATA ENGINE ---
    // We give the AI the "True Context" of Feb 22, 2026 so it doesn't hallucinate.
    const REAL_2026_CONTEXT = `
        DATE: Feb 22, 2026.
        SPORTS: Winter Olympics Milano Cortina 2026 is ending. Today is the USA vs Canada Men's Hockey Final. LA Galaxy vs NYC FC season opener in MLS.
        TECH: Samsung Galaxy S26 leaks show Unpacked on Feb 25. Nvidia hitting record revenue due to AI demand. NASA Artemis II moon mission delayed to March.
        CARS: BMW now allows non-Tesla EVs to use Superchargers. Hyundai Palisade 2026 price reveal in Pakistan.
        COOKING: Trends include 'New Nostalgia', beef tallow resurgence, and high-fiber prebiotic foods.
    `;

    async function generateRealNews(focusTopic = "") {
        const feed = document.getElementById('feed');
        feed.innerHTML = '<div id="loader"><div class="spinner"></div><p>Fetching real stories...</p></div>';

        // Sorting categories by user's 'Likes' for the recommendation engine
        const sortedCats = Object.keys(algoWeights).sort((a,b) => algoWeights[b] - algoWeights[a]);
        const primaryTopic = focusTopic || sortedCats[0];

        const prompt = `You are a real-time news journalist on Feb 22, 2026. 
        Using this REAL CONTEXT: ${REAL_2026_CONTEXT}, write 3 distinct news articles about ${primaryTopic}.
        Format as JSON array: [{"category": "", "title": "", "summary": "", "imgKeywords": ""}]
        Use REAL images keywords for Unsplash (e.g., "samsung phone", "ice hockey", "chef cooking").`;

        try {
            const apiKey = localStorage.getItem('groq_key') || prompt("Enter Groq Key to enable 2026 News Feed:");
            if(!apiKey) return;
            localStorage.setItem('groq_key', apiKey);

            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{role: "user", content: prompt}],
                    response_format: { type: "json_object" }
                })
            });

            const data = await response.json();
            const news = JSON.parse(data.choices[0].message.content).articles || JSON.parse(data.choices[0].message.content).news || Object.values(JSON.parse(data.choices[0].message.content))[0];
            
            feed.innerHTML = `<div class="section-title">Recommended for You: ${primaryTopic}</div>`;
            
            news.forEach((item, index) => {
                // Real Image Source (Unsplash) - Adding a random seed for variety
                const imgUrl = `https://images.unsplash.com/photo-1?auto=format&fit=crop&w=800&q=80&keywords=${encodeURIComponent(item.imgKeywords)}&sig=${Math.random()}`;
                
                // Fallback for keywords that don't match well
                const finalImg = `https://loremflickr.com/600/400/${item.category.toLowerCase()}/all?lock=${Math.floor(Math.random()*1000)}`;

                feed.innerHTML += `
                    <div class="post">
                        <img src="${finalImg}" alt="Real News Image">
                        <div class="post-content">
                            <span class="badge">${item.category}</span>
                            <h3>${item.title}</h3>
                            <p>${item.summary}</p>
                            <div class="post-actions">
                                <div class="like-btn" onclick="likeTopic('${item.category}', this)">🤍 Like</div>
                                <div style="font-size: 12px; color: var(--dim)">Feb 22, 2026</div>
                            </div>
                        </div>
                    </div>
                `;
            });

        } catch (e) {
            feed.innerHTML = "<p>Error syncing news. Check your API key.</p>";
        }
    }

    function likeTopic(cat, btn) {
        btn.classList.toggle('active');
        if(btn.classList.contains('active')) {
            btn.innerHTML = "❤️ Liked";
            algoWeights[cat] = (algoWeights[cat] || 1) + 2; // Weight the algorithm
        } else {
            btn.innerHTML = "🤍 Like";
            algoWeights[cat] -= 2;
        }
        localStorage.setItem('dg_weights', JSON.stringify(algoWeights));
    }

    // Initialize
    generateRealNews();
</script>
</body>
</html>
