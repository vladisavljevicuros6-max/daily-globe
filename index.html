<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Globe - Groq Powered</title>
    <style>
        :root { --bg: #fafafa; --accent: #0095f6; --border: #dbdbdb; --text: #262626; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .header { background: #fff; border-bottom: 1px solid var(--border); padding: 15px; text-align: center; position: sticky; top: 0; z-index: 10; }
        .header h1 { font-size: 24px; margin: 0; font-style: italic; font-weight: 800; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; }
        
        /* Stories Bar */
        .stories { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0 20px; scrollbar-width: none; }
        .story { display: flex; flex-direction: column; align-items: center; min-width: 70px; cursor: pointer; }
        .ring { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #fd1d1d; padding: 2px; transition: 0.3s; }
        .story.active .ring { border-color: var(--accent); background: var(--accent); }
        .ring img { width: 100%; height: 100%; border-radius: 50%; background: #eee; }
        .story span { font-size: 11px; margin-top: 5px; font-weight: 600; }

        /* App Logic UI */
        .card { background: #fff; border: 1px solid var(--border); padding: 20px; border-radius: 8px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid var(--border); border-radius: 5px; box-sizing: border-box; }
        .btn { background: var(--accent); color: #fff; border: none; width: 100%; padding: 12px; font-weight: 700; border-radius: 5px; cursor: pointer; }
        
        /* Feed */
        .post { background: #fff; border: 1px solid var(--border); margin-top: 15px; border-radius: 3px; }
        .p-head { padding: 12px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; }
        .avatar { width: 30px; height: 30px; border-radius: 50%; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        .p-body { padding: 15px; font-size: 14px; line-height: 1.5; border-top: 1px solid #efefef; }
        .p-foot { padding: 10px 15px; border-top: 1px solid #efefef; color: var(--accent); font-weight: 600; font-size: 13px; }

        #loader { display: none; margin: 20px; font-weight: 700; color: var(--accent); text-align: center; }
    </style>
</head>
<body>

    <div class="header"><h1>Daily Globe</h1></div>

    <div class="container">
        <div id="setup" class="card">
            <h3>Enter Groq API Key</h3>
            <p style="font-size:12px; color:gray">Get it free at console.groq.com</p>
            <input type="password" id="apiKey" placeholder="gsk_...">
            <button class="btn" onclick="saveKey()">Start Browsing</button>
        </div>

        <div id="app" style="display:none">
            <div class="stories">
                <div class="story" onclick="tgl(this, 'Tech')"><div class="ring"><img src="https://img.icons8.com/fluency/96/circuit.png"></div><span>Tech</span></div>
                <div class="story" onclick="tgl(this, 'Gaming')"><div class="ring"><img src="https://img.icons8.com/fluency/96/controller.png"></div><span>Gaming</span></div>
                <div class="story" onclick="tgl(this, 'Space')"><div class="ring"><img src="https://img.icons8.com/fluency/96/rocket.png"></div><span>Space</span></div>
                <div class="story" onclick="tgl(this, 'Music')"><div class="ring"><img src="https://img.icons8.com/fluency/96/musical-notes.png"></div><span>Music</span></div>
            </div>
            <button class="btn" onclick="loadFeed()">Refresh Feed</button>
            <div id="loader">Syncing with Satellite...</div>
            <div id="feed"></div>
            <p onclick="localStorage.clear(); location.reload()" style="text-align:center; font-size:10px; color:gray; cursor:pointer; margin-top:20px">Reset API Key</p>
        </div>
    </div>

<script>
    let picked = [];
    function tgl(el, t) {
        el.classList.toggle('active');
        picked = Array.from(document.querySelectorAll('.story.active')).map(s => s.querySelector('span').innerText);
    }

    function saveKey() {
        const k = document.getElementById('apiKey').value.trim();
        if(k.startsWith('gsk_')) { localStorage.setItem('groq_key', k); init(); }
        else alert("Invalid Groq Key");
    }

    function init() {
        if(localStorage.getItem('groq_key')) {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }
    }

    async function loadFeed() {
        if(picked.length === 0) return alert("Select a topic!");
        const loader = document.getElementById('loader');
        const feed = document.getElementById('feed');
        const key = localStorage.getItem('groq_key');

        loader.style.display = "block";
        feed.innerHTML = "";

        try {
            // Groq allows direct browser calls MUCH better than Hugging Face
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${key}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{role: "user", content: `Write 3 viral, short news posts for teens about ${picked.join(" and ")}. Use emojis and a cool tone.`}]
                })
            });

            const data = await res.json();
            const text = data.choices[0].message.content;
            const posts = text.split(/\d\./).filter(p => p.trim().length > 5);

            posts.forEach(p => {
                feed.innerHTML += `
                    <div class="post">
                        <div class="p-head"><div class="avatar">DG</div> dailyglobe_official</div>
                        <div class="p-body">${p.trim().replace(/\n/g, '<br>')}</div>
                        <div class="p-foot">❤️ Liked by thousands</div>
                    </div>
                `;
            });
        } catch (e) {
            alert("Error: Check your API Key or AdBlocker.");
        } finally {
            loader.style.display = "none";
        }
    }
    init();
</script>
</body>
</html>
