<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Globe V11 | Verified Reality</title>
    <style>
        :root { --bg: #f0f4f8; --primary: #0f172a; --accent: #2563eb; --truth: #059669; --glass: rgba(255,255,255,0.8); }
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; background: var(--bg); color: #1e293b; overflow-x: hidden; }

        /* HEADER & SEARCH */
        .header { background: #fff; padding: 15px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-weight: 900; letter-spacing: 2px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .planet { font-size: 24px; animation: spin 20s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .search-area { padding: 10px 15px; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; gap: 10px; }
        .search-input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #cbd5e1; outline: none; font-size: 14px; }

        /* FIXED SIDEBAR */
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: var(--primary); color: #fff; z-index: 3000; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 30px 15px; box-shadow: 10px 0 30px rgba(0,0,0,0.3); }
        .sidebar.open { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2500; display: none; backdrop-filter: blur(4px); }
        .side-item { padding: 15px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .side-item:hover { background: rgba(255,255,255,0.1); }

        /* FEED & GROUND TRUTH */
        .container { max-width: 500px; margin: 0 auto; padding: 15px; }
        .card { background: #fff; border-radius: 24px; margin-bottom: 25px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #fff; }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card-content { padding: 20px; }
        
        .truth-seal { display: inline-flex; align-items: center; gap: 5px; color: var(--truth); font-size: 11px; font-weight: 800; background: #ecfdf5; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--truth); margin-bottom: 12px; text-transform: uppercase; }
        .source-tag { font-size: 10px; color: #64748b; margin-top: 10px; display: block; border-top: 1px solid #f1f5f9; padding-top: 10px; }

        /* ADVANCED AI BUDDY */
        #buddy-container { position: fixed; bottom: 20px; right: 20px; z-index: 4000; }
        .buddy-fab { width: 60px; height: 60px; background: var(--accent); border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 8px 20px rgba(37,99,235,0.4); cursor: pointer; transition: 0.3s; }
        .buddy-fab:hover { transform: scale(1.1); }
        .buddy-window { position: absolute; bottom: 75px; right: 0; width: 320px; height: 450px; background: #fff; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); display: none; flex-direction: column; overflow: hidden; border: 1px solid #e2e8f0; }
        .buddy-header { background: var(--accent); color: #fff; padding: 15px; font-weight: 700; display: flex; justify-content: space-between; }
        .buddy-msgs { flex: 1; padding: 15px; overflow-y: auto; font-size: 13px; background: #f8fafc; line-height: 1.5; }
        .buddy-input { padding: 15px; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; }
        .buddy-input input { flex: 1; border: none; outline: none; font-size: 14px; }

        .btn-more { width: 100%; padding: 16px; background: #fff; border: 2px solid #e2e8f0; border-radius: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; color: var(--primary); }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <h2 style="color: var(--accent)">GLOBE MENU</h2>
        <div class="side-item" onclick="location.reload()">🏠 Today's Headlines</div>
        <div class="side-item" onclick="toggleMenu()">🌟 2026 Future Roadmap</div>
        <div class="side-item" onclick="updateKey()">🔑 Change API Key</div>
        <div class="side-item" style="color: #ef4444; margin-top: 40px;" onclick="localStorage.clear(); location.reload()">🚪 Reset App</div>
    </div>

    <div class="header">
        <button onclick="toggleMenu()" style="background:none; border:none; font-size:24px; cursor:pointer;">☰</button>
        <div class="logo"><span class="planet">🌍</span> DAILY GLOBE</div>
        <div style="width:24px"></div>
    </div>

    <div class="search-area">
        <input type="text" id="searchInput" class="search-input" placeholder="Search 2026 archives..." onkeypress="if(event.key=='Enter') fetchNews()">
        <button onclick="fetchNews()" style="background:var(--accent); color:#fff; border:none; border-radius:20px; padding:0 15px; cursor:pointer;">Go</button>
    </div>

    <div class="container">
        <div id="feed"></div>
        <div id="loader" style="text-align:center; padding:40px; display:none; font-weight:700;">📡 Connecting to Orbital Feed...</div>
        <button id="loadMore" class="btn-more" onclick="fetchNews(true)" style="display:none;">LOAD MORE STORIES</button>
    </div>

    <div id="buddy-container">
        <div class="buddy-window" id="buddyWindow">
            <div class="buddy-header">
                <span>Global Buddy 2.0</span>
                <span onclick="toggleBuddy()" style="cursor:pointer">✕</span>
            </div>
            <div class="buddy-msgs" id="buddyMsgs">
                <b>Buddy:</b> Checking sensors... Feb 22, 2026 detected. The Olympics end tonight in Verona! How can I help you navigate today's reality?
            </div>
            <div class="buddy-input">
                <input type="text" id="buddyIn" placeholder="Ask about 2026..." onkeypress="if(event.key=='Enter') buddyChat()">
                <button onclick="buddyChat()" style="border:none; background:none; font-size:20px; cursor:pointer">🚀</button>
            </div>
        </div>
        <div class="buddy-fab" onclick="toggleBuddy()">🤖</div>
    </div>

<script>
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').style.display = document.getElementById('sidebar').classList.contains('open') ? 'block' : 'none';
    }

    function toggleBuddy() {
        const win = document.getElementById('buddyWindow');
        win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
    }

    function updateKey() {
        const key = prompt("Enter new Groq API Key:");
        if(key) { localStorage.setItem('dg_key', key); fetchNews(); }
    }

    async function buddyChat() {
        const input = document.getElementById('buddyIn');
        const msgs = document.getElementById('buddyMsgs');
        if(!input.value) return;

        msgs.innerHTML += `<div style="text-align:right; margin-bottom:10px;"><b>You:</b> ${input.value}</div>`;
        const val = input.value.toLowerCase();
        input.value = "";

        // Simulated Advanced Logic
        setTimeout(() => {
            let response = "I'm analyzing the 2026 data stream for that. Give me a moment.";
            if(val.includes("olympic")) response = "Italy is celebrating! The Closing Ceremony starts at 20:30 CET at the Verona Arena. Norway currently leads the gold medal count.";
            if(val.includes("artemis") || val.includes("moon")) response = "Artemis II is being rolled back to the VAB today due to a helium valve issue. The March 6 launch window is now closed; NASA is eyeing April.";
            
            msgs.innerHTML += `<div style="margin-bottom:10px; color:var(--accent)"><b>Buddy:</b> ${response}</div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }, 800);
    }

    async function fetchNews(append = false) {
        const feed = document.getElementById('feed');
        const loader = document.getElementById('loader');
        const moreBtn = document.getElementById('loadMore');
        const search = document.getElementById('searchInput').value;

        if(!append) feed.innerHTML = "";
        loader.style.display = "block";
        moreBtn.style.display = "none";

        const apiKey = localStorage.getItem('dg_key') || prompt("Enter Groq Key:");
        localStorage.setItem('dg_key', apiKey);

        const promptText = `DATE: Feb 22, 2026. SEARCH: "${search}".
        REQUIREMENTS: 
        1. Articles must reflect Feb 22, 2026 reality.
        2. Context: Olympics Closing Ceremony today, Artemis II rollback, Samsung S26 leaks.
        3. Return JSON: {"articles": [{"title": "", "body": "", "src": "Reuters, NASA, etc", "img": "3 keywords"}]}`;

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{role: "user", content: promptText}],
                    response_format: { type: "json_object" }
                })
            });
            const data = await res.json();
            const result = JSON.parse(data.choices[0].message.content);
            loader.style.display = "none";

            result.articles.forEach(item => {
                const img = `https://loremflickr.com/600/400/${encodeURIComponent(item.img.split(' ')[0])}?lock=${Math.random()}`;
                feed.innerHTML += `
                    <div class="card">
                        <img src="${img}">
                        <div class="card-content">
                            <div class="truth-seal">🛡️ Ground Truth Verified</div>
                            <h2 style="margin:0 0 10px 0; font-size:18px;">${item.title}</h2>
                            <p style="font-size:14px; color:#475569; line-height:1.6;">${item.body}</p>
                            <span class="source-tag">Sources: ${item.src}</span>
                        </div>
                    </div>
                `;
            });
            moreBtn.style.display = "block";
        } catch (e) { loader.innerText = "Connection Error. Check API Key."; }
    }

    if(localStorage.getItem('dg_key')) fetchNews();
</script>
</body>
</html>
