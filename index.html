<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Globe V13 | Obsidian Protocol</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #3b82f6; --primary: #2563eb; }
        body { font-family: 'Inter', -apple-system, sans-serif; margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* HEADER & UI ELEMENTS */
        .header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); padding: 15px; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; }
        .logo { font-weight: 900; letter-spacing: 2px; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .planet { font-size: 24px; animation: rotate 20s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* SIDEBAR (FIXED) */
        .sidebar { position: fixed; left: -300px; top: 0; width: 280px; height: 100%; background: #000; z-index: 3000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 40px 20px; border-right: 1px solid var(--accent); }
        .sidebar.open { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 2000; }

        /* INTEREST TABS */
        .tabs { display: flex; overflow-x: auto; padding: 15px; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); scrollbar-width: none; }
        .tab { padding: 8px 18px; border-radius: 20px; background: var(--card); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 600; color: #94a3b8; }
        .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* SEARCH BAR */
        .search-container { padding: 10px 15px; }
        .search-input { width: 100%; padding: 12px 20px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); background: var(--card); color: #fff; outline: none; box-sizing: border-box; }

        /* FEED & CARDS */
        .container { max-width: 550px; margin: 0 auto; padding: 15px; }
        .card { background: var(--card); border-radius: 24px; margin-bottom: 25px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .card img { width: 100%; height: 280px; object-fit: cover; }
        .card-body { padding: 20px; }
        .card-tag { color: var(--accent); font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .btn-fullscreen { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
        .btn-ar { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 50%; font-size: 18px; border: none; cursor: pointer; }

        /* FULLSCREEN MODAL */
        .modal { position: fixed; inset: 0; background: var(--bg); z-index: 4000; display: none; overflow-y: auto; padding: 30px 20px; }
        .close-modal { position: sticky; top: 0; background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 20px; font-weight: 700; cursor: pointer; }

        /* AI BUDDY 4.0 */
        .buddy-fab { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4); cursor: pointer; z-index: 1000; border: 2px solid rgba(255,255,255,0.2); }
        .buddy-chat { position: fixed; bottom: 95px; right: 25px; width: 320px; height: 450px; background: var(--card); border-radius: 24px; display: none; flex-direction: column; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.5); z-index: 1001; }
        .chat-header { background: var(--accent); padding: 15px; font-weight: 700; display: flex; justify-content: space-between; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
        .chat-input { padding: 10px; display: flex; gap: 5px; border-top: 1px solid rgba(255,255,255,0.1); }

        .btn-more { width: 100%; padding: 18px; background: var(--card); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 20px; font-weight: 800; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <h1 style="color:var(--accent); font-size: 24px;">GLOBE V13</h1>
        <hr style="opacity:0.1; margin: 20px 0;">
        <div class="tab" style="margin-bottom:10px" onclick="toggleRoadmap()">📅 2026 Roadmap</div>
        <div class="tab" style="margin-bottom:10px" onclick="location.reload()">🏠 Reset Feed</div>
        <div class="tab" style="margin-bottom:10px" onclick="updateKey()">🔑 Update API Key</div>
        <p style="font-size:11px; opacity:0.4; margin-top:50px">Protocol: Obsidian Ground-Truth</p>
    </div>

    <div class="header">
        <button onclick="toggleMenu()" style="background:none; border:none; font-size:24px; color:#fff; cursor:pointer">☰</button>
        <div class="logo"><span class="planet">🌍</span> DAILY GLOBE</div>
        <div style="width:24px"></div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="setInterest('Home', this)">Home (2026)</div>
        <div class="tab" onclick="setInterest('Gaming', this)">Gaming</div>
        <div class="tab" onclick="setInterest('Tech', this)">Tech</div>
        <div class="tab" onclick="setInterest('Sport', this)">Sport</div>
        <div class="tab" onclick="setInterest('Cars', this)">Cars</div>
        <div class="tab" onclick="setInterest('Cooking', this)">Cooking</div>
        <div class="tab" onclick="setInterest('Politics', this)">Politics</div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search any year (2024, 2025, 2026)..." onkeypress="if(event.key=='Enter') fetchNews(false, true)">
    </div>

    <div class="container">
        <div id="feed"></div>
        <div id="loader" style="text-align:center; display:none; padding:40px">📡 Verifying 2026 Timeline...</div>
        <button id="loadMore" class="btn-more" onclick="fetchNews(true)" style="display:none">LOAD MORE NEWS</button>
    </div>

    <div class="modal" id="fullscreenModal">
        <button class="close-modal" onclick="closeFullscreen()">CLOSE FULLSCREEN</button>
        <div id="fullContent"></div>
    </div>

    <div class="buddy-fab" onclick="toggleBuddy()">🤖</div>
    <div class="buddy-chat" id="buddyWindow">
        <div class="chat-header"><span>Globe Buddy 4.0</span><span onclick="toggleBuddy()" style="cursor:pointer">✕</span></div>
        <div class="chat-body" id="chatMsgs"><b>Buddy:</b> I'm connected to the 2026 API. Ask me about GTA VI, the Olympics, or Artemis II.</div>
        <div class="chat-input">
            <input type="text" id="buddyInput" placeholder="Ask Buddy..." style="flex:1; background:none; border:none; color:#fff; outline:none;" onkeypress="if(event.key=='Enter') chat()">
            <button onclick="chat()" style="border:none; background:none; color:var(--accent); cursor:pointer">Send</button>
        </div>
    </div>

<script>
    let activeInterest = "Home";
    let currentPage = 1;

    function toggleMenu() { 
        const s = document.getElementById('sidebar');
        const o = document.getElementById('overlay');
        s.classList.toggle('open');
        o.style.display = s.classList.contains('open') ? 'block' : 'none';
    }

    function toggleBuddy() { const w = document.getElementById('buddyWindow'); w.style.display = w.style.display === 'flex' ? 'none' : 'flex'; }

    function setInterest(interest, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        activeInterest = interest;
        document.getElementById('searchInput').value = ""; // Clear search when tab changes
        fetchNews();
    }

    async function fetchNews(append = false, isSearch = false) {
        const feed = document.getElementById('feed');
        const loader = document.getElementById('loader');
        const moreBtn = document.getElementById('loadMore');
        const searchVal = document.getElementById('searchInput').value;

        if(!append) { feed.innerHTML = ""; currentPage = 1; } else { currentPage++; }
        loader.style.display = "block";
        moreBtn.style.display = "none";

        const apiKey = localStorage.getItem('dg_key') || prompt("Enter Groq Key:");
        localStorage.setItem('dg_key', apiKey);

        const promptTxt = isSearch 
            ? `SEARCH MODE: Historical or Current. Query: "${searchVal}". Page: ${currentPage}. Provide 3 real news articles from any year requested.`
            : `2026 PROTOCOL: Strictly Feb 22, 2026. Interest: ${activeInterest}. Page: ${currentPage}. If the news isn't a documented 2026 event (GTA VI delay, Artemis II leak, Milan Olympics Closing), return an empty list.`;

        const finalPrompt = promptTxt + ` Return JSON: {"news": [{"tag": "", "title": "", "summary": "", "full": "Long detailed article text with sources", "img": "3 visual keywords", "ar": true}]}`;

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{role: "user", content: finalPrompt}],
                    response_format: { type: "json_object" }
                })
            });
            const data = await res.json();
            const result = JSON.parse(data.choices[0].message.content);
            loader.style.display = "none";

            if(!result.news || result.news.length === 0) {
                if(!append) feed.innerHTML = "<p style='text-align:center; padding:40px; opacity:0.5;'>⚠️ No unverified data shown. This event did not occur in the 2026 record.</p>";
                return;
            }

            result.news.forEach(item => {
                const img = `https://loremflickr.com/800/600/${encodeURIComponent(item.img.split(' ')[0])}?lock=${Math.random()}`;
                feed.innerHTML += `
                    <div class="card">
                        <button class="btn-fullscreen" onclick="openFullscreen(\`${item.title}\`, \`${item.full}\`, \`${img}\`)">📑 FULLSCREEN</button>
                        ${item.ar ? '<button class="btn-ar">🧊</button>' : ''}
                        <img src="${img}">
                        <div class="card-body">
                            <span class="card-tag">${item.tag}</span>
                            <h2 style="margin:0 0 10px 0;">${item.title}</h2>
                            <p style="font-size:14px; opacity:0.8; line-height:1.6;">${item.summary}</p>
                        </div>
                    </div>
                `;
            });
            moreBtn.style.display = "block";
        } catch (e) { loader.innerText = "Connection Error."; }
    }

    function openFullscreen(title, content, img) {
        document.getElementById('fullscreenModal').style.display = "block";
        document.getElementById('fullContent').innerHTML = `
            <img src="${img}" style="width:100%; border-radius:20px; margin-bottom:20px;">
            <h1 style="color:var(--accent)">${title}</h1>
            <p style="font-size:18px; line-height:1.8; opacity:0.9;">${content}</p>
        `;
    }

    function closeFullscreen() { document.getElementById('fullscreenModal').style.display = "none"; }

    async function chat() {
        const input = document.getElementById('buddyInput');
        const msgs = document.getElementById('chatMsgs');
        const text = input.value;
        if(!text) return;
        
        msgs.innerHTML += `<div style="text-align:right; margin:10px 0; color:var(--accent)"><b>You:</b> ${text}</div>`;
        input.value = "";

        const apiKey = localStorage.getItem('dg_key');
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{role: "system", content: "You are Globe Buddy. Today is Feb 22, 2026. Be witty and factual about 2026 events."}, {role: "user", content: text}]
            })
        });
        const data = await res.json();
        const reply = data.choices[0].message.content;
        msgs.innerHTML += `<div style="margin:10px 0;"><b>Buddy:</b> ${reply}</div>`;
        msgs.scrollTop = msgs.scrollHeight;
    }

    function updateKey() { const k = prompt("New API Key:"); if(k) localStorage.setItem('dg_key', k); location.reload(); }
    function toggleRoadmap() { alert("2026 Milestones:\n- FEB 22: Olympic Closing Ceremony\n- FEB 25: Samsung Unpacked\n- MAR 6: Artemis II Launch Window\n- NOV 19: GTA VI Launch"); }

    if(localStorage.getItem('dg_key')) fetchNews();
</script>
</body>
</html>
