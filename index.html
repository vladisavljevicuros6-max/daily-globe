<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Globe V15 | Prism Protocol</title>
    <style>
        :root { --bg: #05070a; --card: #11141d; --text: #f1f5f9; --accent: #3b82f6; --dim: #94a3b8; }
        body { font-family: 'Inter', -apple-system, sans-serif; margin: 0; background: var(--bg); color: var(--text); }

        /* HEADER */
        .header { background: #000; padding: 20px; border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; letter-spacing: 4px; font-size: 18px; color: var(--accent); }
        
        /* CATEGORY TABS */
        .tabs { display: flex; overflow-x: auto; padding: 15px; gap: 10px; background: #000; border-bottom: 1px solid #1e293b; scrollbar-width: none; }
        .tab { padding: 8px 18px; border-radius: 20px; background: #1e293b; border: 1px solid transparent; cursor: pointer; white-space: nowrap; font-size: 12px; font-weight: 700; color: var(--dim); transition: 0.3s; }
        .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* FEED & CARDS */
        .feed { max-width: 600px; margin: 0 auto; padding: 20px; }
        .card { background: var(--card); border-radius: 24px; margin-bottom: 30px; overflow: hidden; border: 1px solid #1e293b; }
        .card-img { width: 100%; height: 240px; background: #1e293b; object-fit: cover; }
        .card-body { padding: 25px; }
        .tag { font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .btn-open { width: 100%; padding: 12px; margin-top: 15px; border-radius: 12px; border: 1px solid var(--accent); background: rgba(59,130,246,0.1); color: var(--accent); font-weight: 700; cursor: pointer; }

        /* DOSSIER (FULLSCREEN) */
        .dossier { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; overflow-y: auto; padding: 40px 20px; }
        .dossier-inner { max-width: 650px; margin: 0 auto; }
        .dossier-img { width: 100%; border-radius: 20px; margin-bottom: 30px; }
        .close-btn { position: sticky; top: 0; background: var(--accent); color: #fff; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 800; cursor: pointer; margin-bottom: 30px; }

        /* SEARCH & LOADER */
        .search-area { padding: 10px 20px; }
        .search-bar { width: 100%; padding: 14px; border-radius: 15px; border: 1px solid #1e293b; background: #11141d; color: #fff; }
        #loader { text-align: center; padding: 50px; color: var(--accent); font-weight: 800; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">DAILY GLOBE</div>
        <div style="font-size: 10px; opacity: 0.6;">FEB 22, 2026</div>
    </div>

    <div class="tabs" id="tabContainer">
        <div class="tab active" onclick="changeCategory('Trending', this)">Home</div>
        <div class="tab" onclick="changeCategory('Gaming', this)">Gaming</div>
        <div class="tab" onclick="changeCategory('Tech', this)">Tech</div>
        <div class="tab" onclick="changeCategory('Sport', this)">Sport</div>
        <div class="tab" onclick="changeCategory('Cars', this)">Cars</div>
        <div class="tab" onclick="changeCategory('Cooking', this)">Cooking</div>
        <div class="tab" onclick="changeCategory('Politics', this)">Politics</div>
    </div>

    <div class="search-area">
        <input type="text" id="search" class="search-bar" placeholder="Search 2026 records..." onkeypress="if(event.key=='Enter') fetchNews(false, true)">
    </div>

    <div class="feed" id="feed"></div>
    <div id="loader" style="display:none">SYNCING DATA...</div>
    <button id="loadMore" style="display:none; margin: 20px auto; width: 200px;" class="btn-open" onclick="fetchNews(true)">LOAD MORE</button>

    <div class="dossier" id="dossier">
        <div class="dossier-inner">
            <button class="close-btn" onclick="closeDossier()">CLOSE FULLSCREEN VIEW</button>
            <div id="dossierContent"></div>
        </div>
    </div>

<script>
    let activeCat = "Trending";
    let page = 1;

    function changeCategory(cat, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        activeCat = cat;
        fetchNews();
    }

    function closeDossier() { document.getElementById('dossier').style.display = 'none'; }

    async function fetchNews(append = false, isSearch = false) {
        const feed = document.getElementById('feed');
        const loader = document.getElementById('loader');
        const moreBtn = document.getElementById('loadMore');
        const searchVal = document.getElementById('search').value;

        if(!append) { feed.innerHTML = ""; page = 1; } else { page++; }
        loader.style.display = "block";
        moreBtn.style.display = "none";

        const apiKey = localStorage.getItem('dg_key') || prompt("Groq Key:");
        localStorage.setItem('dg_key', apiKey);

        // This prompt ensures Interest Tabs show DIFFERENT news
        const sysPrompt = `DATE: Feb 22, 2026. INTEREST: ${activeCat}. SEARCH: ${searchVal}. 
        STRICT 2026 DATA: GTA VI (Nov 19), Milan Olympics (Ends today), Artemis II (Rollback to VAB), Samsung S26 leaks.
        REQUEST: Return exactly 6 unique news articles. Each MUST be related specifically to the ${activeCat} category.
        Return JSON: {"articles": [{"title": "", "summary": "", "full": "300 words of technical detail", "img_tag": "specific visual keyword"}]}`;

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{role: "user", content: sysPrompt}],
                    response_format: { type: "json_object" }
                })
            });
            const data = await res.json();
            const result = JSON.parse(data.choices[0].message.content);
            loader.style.display = "none";

            result.articles.forEach(item => {
                // FIXED IMAGE LOGIC: Uses unique keywords + seed to prevent duplicate images
                const img = `https://loremflickr.com/800/600/${encodeURIComponent(item.img_tag || 'news')}?sig=${Math.floor(Math.random() * 1000)}`;
                feed.innerHTML += `
                    <div class="card">
                        <img src="${img}" class="card-img" onerror="this.src='https://via.placeholder.com/800x400/1e293b/ffffff?text=Image+Not+Available'">
                        <div class="card-body">
                            <span class="tag">${activeCat}</span>
                            <h2 style="margin:10px 0;">${item.title}</h2>
                            <p style="font-size:14px; color:var(--dim);">${item.summary}</p>
                            <button class="btn-open" onclick="openDossier(\`${item.title}\`, \`${item.full.replace(/'/g, "&apos;")}\`, \`${img}\`)">VIEW FULL DOSSIER</button>
                        </div>
                    </div>
                `;
            });
            moreBtn.style.display = "block";
        } catch (e) { loader.innerText = "Error loading 2026 data stream."; }
    }

    function openDossier(title, full, img) {
        document.getElementById('dossier').style.display = 'block';
        document.getElementById('dossierContent').innerHTML = `
            <img src="${img}" class="dossier-img">
            <h1 style="font-size: 28px; color: var(--accent);">${title}</h1>
            <div style="font-size: 16px; line-height: 1.8; color: var(--dim);">${full}</div>
        `;
    }

    if(localStorage.getItem('dg_key')) fetchNews();
</script>
</body>
</html>
