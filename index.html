<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Globe</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Daily Globe">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/007bff/ffffff?text=DG">
    
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --primary: #007bff;
            --secondary: #6c757d;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #f4f7f6;
            --card-bg: #1e1e1e;
            --primary: #4da3ff;
            --secondary: #a0a0a0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
            padding-top: env(safe-area-inset-top, 20px); /* For iOS notch */
        }
        .container { max-width: 600px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 24px; color: var(--primary); }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid var(--secondary); border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; background: var(--bg-color); color: var(--text-color); }
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; }
        button:active { opacity: 0.8; }
        .btn-secondary { background-color: var(--secondary); margin-top: 10px; }
        .article { border-bottom: 1px solid var(--secondary); padding-bottom: 15px; margin-bottom: 15px; }
        .article:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .article h3 { margin: 0 0 10px 0; font-size: 18px; }
        .loader { display: none; text-align: center; padding: 20px; font-style: italic; color: var(--secondary); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📰 Daily Globe</h1>
        <button id="themeToggle" style="width: auto; padding: 8px 12px;">🌙</button>
    </header>

    <div class="card">
        <label for="topics"><strong>Your Interests:</strong></label>
        <p style="font-size: 12px; color: var(--secondary); margin-top: 5px;">e.g., Gaming, Space, AI, Basketball</p>
        <input type="text" id="topics" placeholder="Enter topics separated by commas...">
        
        <input type="text" id="apiKey" placeholder="Hugging Face API Key (hf_...)" style="margin-top: 10px;">
        
        <button onclick="generateNews()">Generate Daily Digest</button>
        <button class="btn-secondary" onclick="generateNews('explain')">Explain Simply Mode</button>
    </div>

    <div id="loader" class="loader">The Daily Globe is writing your news... 🤖</div>

    <div class="card" id="newsContainer" style="display: none;">
        </div>
</div>

<script>
    // --- State Management ---
    const topicsInput = document.getElementById('topics');
    const apiKeyInput = document.getElementById('apiKey');
    const themeToggle = document.getElementById('themeToggle');
    
    // Load saved data on startup (Updated keys for Daily Globe)
    window.onload = () => {
        topicsInput.value = localStorage.getItem('dailyGlobe_topics') || 'Gaming, Technology, Science';
        apiKeyInput.value = localStorage.getItem('dailyGlobe_apiKey') || '';
        if (localStorage.getItem('dailyGlobe_theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            themeToggle.innerText = '☀️';
        }
    };

    // Theme Toggle Logic
    themeToggle.addEventListener('click', () => {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        if (isDark) {
            document.body.removeAttribute('data-theme');
            localStorage.setItem('dailyGlobe_theme', 'light');
            themeToggle.innerText = '🌙';
        } else {
            document.body.setAttribute('data-theme', 'dark');
            localStorage.setItem('dailyGlobe_theme', 'dark');
            themeToggle.innerText = '☀️';
        }
    });

    // --- AI Integration (Hugging Face) ---
    async function generateNews(mode = 'standard') {
        const topics = topicsInput.value;
        const apiKey = apiKeyInput.value;

        if (!apiKey) {
            alert("Please enter a free Hugging Face API key.");
            return;
        }

        // Save preferences
        localStorage.setItem('dailyGlobe_topics', topics);
        localStorage.setItem('dailyGlobe_apiKey', apiKey);

        document.getElementById('loader').style.display = 'block';
        document.getElementById('newsContainer').style.display = 'none';

        // Prompt Design
        let systemPrompt = `You are a news summarizer for teenagers. Provide 3 short, easy-to-read, and engaging news summaries based on these topics: ${topics}. Format your response cleanly with a title for each summary. Do not include introductory text, just the news.`;
        
        if (mode === 'explain') {
            systemPrompt += " Use extremely simple language, explain any hard concepts like a teacher would, and use emojis.";
        }

        try {
            // Calling a free, fast model on Hugging Face (Mistral)
            const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2", {
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                method: "POST",
                body: JSON.stringify({
                    inputs: `<s>[INST] ${systemPrompt} [/INST]`,
                    parameters: { max_new_tokens: 500, return_full_text: false, temperature: 0.7 }
                }),
            });

            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error);
            }

            const generatedText = data[0].generated_text;
            displayNews(generatedText);

        } catch (error) {
            alert("Error fetching news: " + error.message);
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    // --- UI Update ---
    function displayNews(text) {
        const container = document.getElementById('newsContainer');
        container.innerHTML = '';
        container.style.display = 'block';

        // Simple formatting: Split by double line breaks and wrap in HTML
        const paragraphs = text.split('\n\n').filter(p => p.trim() !== '');
        
        paragraphs.forEach(p => {
            const articleDiv = document.createElement('div');
            articleDiv.className = 'article';
            // Simple markdown-style bolding parsing
            const formattedText = p.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            articleDiv.innerHTML = `<p>${formattedText}</p>`;
            container.appendChild(articleDiv);
        });
    }
</script>
</body>
</html>
