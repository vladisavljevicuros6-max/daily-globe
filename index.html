<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Globe | Verified 2026</title>
    <style>
        :root { --bg: #ffffff; --text: #000000; --accent: #007aff; --gray: #8e8e93; --card: #f2f2f7; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        
        /* Side Menu */
        .sidebar { position: fixed; left: -280px; top: 0; width: 250px; height: 100%; background: #fff; z-index: 200; transition: 0.3s; box-shadow: 5px 0 15px rgba(0,0,0,0.1); padding: 20px; }
        .sidebar.open { left: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; z-index: 150; }
        
        /* Header */
        .header { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #ddd; position: sticky; top: 0; background: #fff; z-index: 100; }
        .header h1 { flex: 1; text-align: center; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-icon { background: none; border: none; font-size: 20px; cursor: pointer; }

        /* Search */
        .search-area { padding: 10px; border-bottom: 1px solid #eee; display: none; }
        .search-area input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; background: #f2f2f7; box-sizing: border-box; }

        /* Feed */
        .container { max-width: 500px; margin: 0 auto; padding: 15px; }
        .post { margin-bottom: 30px; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .post-img { width: 100%; height: 280px; border-radius: 12px; object-fit: cover; background: #eee; }
        .post-tag { color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; margin: 10px 0 5px; }
        .post-title { font-size: 22px; font-weight: 800; margin: 0 0 10px; line-height: 1.2; }
        .post-desc { color: #444; font-size: 15px; line-height: 1.5; margin-bottom: 15px; }
        
        .actions { display: flex; justify-content: space-between; align-items: center; }
        .like-btn { cursor: pointer; padding: 5px 10px; border-radius: 5px; background: #f2f2f7; font-size: 14px; font-weight: 600; }
        .like-btn.active { background: #ff3b30; color: white; }

        /* States */
        #loader, #no-news { text-align: center; padding: 50px 20px; }
        #no-news { display: none; }
        .error-circle { font-size: 50px; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

    <div id="sidebar" class="sidebar">
        <h2 style="font-size: 20px;">Daily Globe</h2>
        <div style="margin-top: 30px;">
            <p onclick="fetchNews('Sport')">🏅 Sports</p>
            <p onclick="fetchNews('Tech')">💻 Technology</p>
            <p onclick="fetchNews('Cars')">🚗 Automotive</p>
            <p onclick="fetchNews('Cooking')">🍳 Cooking</p>
            <hr>
            <p onclick="localStorage.clear(); location.reload()" style="color:red">Reset App</p>
        </div>
    </div>
    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <div class="header">
        <button class="btn-icon" onclick="toggleMenu()">☰</button>
        <h1>Daily Globe</h1>
        <button class="btn-icon" onclick="toggleSearch()">🔍</button>
    </div>

    <div id="searchBar" class="search-area">
        <input type="text" id="searchInput" placeholder="Search for real 2026 events..." onkeypress="handleSearch(event)">
    </div>

    <div class="container">
        <div id="loader">Checking 2026 verification...</div>
        
        <div id="no-news">
            <span class="error-circle">🚫</span>
            <h3>No Verified News Found</h3>
            <p style="color:gray; font-size:14px;">The 2026 satellite found no real information for this query. Try searching for "Samsung S26", "Winter Olympics", or "MLS".</p>
            <button onclick="fetchNews('Tech')" style="border:none; color:var(--accent); background:none; font-weight:bold; cursor:pointer;">Back to Top Stories</button>
        </div>

        <div id="feed"></div>
    </div>

<script>
    let algo = JSON.parse(localStorage.getItem('globe_algo') || '{"Tech":1}');

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').style.display = document.getElementById('sidebar').classList.contains('open') ? 'block' : 'none';
    }

    function toggleSearch() {
        const s = document.getElementById('searchBar');
        s.style.display = s.style.display === 'block' ? 'none' : 'block';
    }

    function handleSearch(e) {
        if(e.key === 'Enter') fetchNews(document.getElementById('searchInput').value);
    }

    async function fetchNews(query = "") {
        const feed = document.getElementById('feed');
        const loader = document.getElementById('loader');
        const noNews = document.getElementById('no-news');
        const apiKey = localStorage.getItem('groq_key') || prompt("Enter Groq Key:");
        
        if(!apiKey) return;
        localStorage.setItem('groq_key', apiKey);

        loader.style.display = 'block';
        noNews.style.display = 'none';
        feed.innerHTML = '';
        if(document.getElementById('sidebar').classList.contains('open')) toggleMenu();

        // STRICT SYSTEM PROMPT
        const prompt = `CURRENT DATE: Feb 22, 2026. 
        TOPIC: ${query || "Latest verified news"}.
        
        INSTRUCTIONS:
        1. If there is NO real, verifiable news about this topic for late 2025 or 2026, respond ONLY with {"error": "NO_INFO"}.
        2. If news exists, provide 3 articles in this JSON format:
        {"articles": [{"tag": "", "title": "", "summary": "", "imgKeywords": "3 precise keywords for a real photo"}]}
        3. Do not make up fake events. Stick to real 2026 trends (S26 leaks, Winter Olympics, 2026 World Cup prep).`;

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{role: "user", content: prompt}],
                    response_format: { type: "json_object" }
                })
            });

            const data = await res.json();
            const result = JSON.parse(data.choices[0].message.content);

            loader.style.display = 'none';

            if(result.error === "NO_INFO") {
                noNews.style.display = 'block';
                return;
            }

            const news = result.articles || result.news;
            news.forEach(item => {
                // Better Image Logic: Using Unsplash Source with specific keywords
                const imgUrl = `https://loremflickr.com/600/400/${encodeURIComponent(item.imgKeywords.split(' ')[0])},${encodeURIComponent(item.imgKeywords.split(' ')[1])}/all`;
                
                feed.innerHTML += `
                    <div class="post">
                        <img src="${imgUrl}" class="post-img" alt="Real news visual">
                        <div class="post-tag">${item.tag}</div>
                        <h2 class="post-title">${item.title}</h2>
                        <p class="post-desc">${item.summary}</p>
                        <div class="actions">
                            <div class="like-btn" onclick="likePost(this, '${item.tag}')">🤍 Helpful</div>
                            <span style="font-size:11px; color:gray">Verified Feb 22, 2026</span>
                        </div>
                    </div>
                `;
            });

        } catch (e) {
            loader.innerHTML = "Verification failed. Check API Key.";
        }
    }

    function likePost(btn, tag) {
        btn.classList.toggle('active');
        btn.innerText = btn.classList.contains('active') ? "❤️ Liked" : "🤍 Helpful";
        // Algorithm: Store preference
        algo[tag] = (algo[tag] || 0) + 1;
        localStorage.setItem('globe_algo', JSON.stringify(algo));
    }

    // Load top categories on start
    fetchNews();
</script>
</body>
</html>
