<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Globe - IG Edition</title>
    <style>
        :root {
            --bg: #fafafa; --card: #ffffff; --text: #262626;
            --accent: #0095f6; --border: #dbdbdb; --gray: #8e8e8e;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px; position: sticky; top: 0; z-index: 100; text-align: center; }
        .header h1 { font-size: 22px; font-weight: 800; margin: 0; font-style: italic; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; }
        
        /* Stories Selector */
        .stories { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0 20px; scrollbar-width: none; }
        .story { display: flex; flex-direction: column; align-items: center; min-width: 75px; cursor: pointer; }
        .ring { width: 62px; height: 62px; border-radius: 50%; border: 2px solid #d62976; padding: 2px; margin-bottom: 5px; transition: 0.3s; }
        .story.active .ring { background: var(--accent); border-color: var(--accent); }
        .ring img { width: 100%; height: 100%; border-radius: 50%; background: #eee; }
        .story span { font-size: 11px; font-weight: 500; }

        /* Auth Card */
        .auth { background: var(--card); border: 1px solid var(--border); padding: 25px; text-align: center; border-radius: 8px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid var(--border); border-radius: 5px; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; width: 100%; padding: 12px; font-weight: 600; border-radius: 5px; cursor: pointer; }

        /* Feed Posts */
        .post { background: var(--card); border: 1px solid var(--border); margin-bottom: 15px; border-radius: 5px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .p-header { padding: 10px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
        .avatar { width: 30px; height: 30px; border-radius: 50%; background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        .p-content { padding: 15px; font-size: 14px; line-height: 1.6; border-top: 1px solid #fafafa; }
        .p-actions { padding: 10px 15px; font-size: 18px; display: flex; gap: 15px; border-top: 1px solid #fafafa; }
        .p-likes { padding: 0 15px 10px; font-weight: 600; font-size: 13px; color: #444; }

        #status { text-align: center; font-size: 12px; color: var(--gray); margin: 10px; }
        .err { color: #ed4956; font-size: 11px; text-align: center; font-family: monospace; }
    </style>
</head>
<body>

    <div class="header"><h1>Daily Globe</h1></div>

    <div class="container">
        <div id="loginSection" class="auth">
            <h2 style="margin-top:0">Welcome</h2>
            <p style="color:var(--gray); font-size:13px">Enter your Hugging Face Token (hf_...)</p>
            <input type="password" id="hfToken" placeholder="hf_xxxxxxxxxxxx">
            <button class="btn" onclick="saveKey()">Connect</button>
            <p style="font-size:10px; margin-top:15px">Token is saved locally in your browser.</p>
        </div>

        <div id="appSection" style="display:none;">
            <div class="stories">
                <div class="story" onclick="sel(this, 'Science')">
                    <div class="ring"><img src="https://img.icons8.com/fluency/96/test-tube.png"></div>
                    <span>Science</span>
                </div>
                <div class="story" onclick="sel(this, 'Gaming')">
                    <div class="ring"><img src="https://img.icons8.com/fluency/96/controller.png"></div>
                    <span>Gaming</span>
                </div>
                <div class="story" onclick="sel(this, 'Tech')">
                    <div class="ring"><img src="https://img.icons8.com/fluency/96/artificial-intelligence.png"></div>
                    <span>Tech</span>
                </div>
                <div class="story" onclick="sel(this, 'Music')">
                    <div class="ring"><img src="https://img.icons8.com/fluency/96/musical-notes.png"></div>
                    <span>Music</span>
                </div>
            </div>

            <button class="btn" onclick="fetchNews()">Refresh Feed</button>
            <div id="status">Ready to explore</div>
            <div id="debug" class="err"></div>

            <div id="feed"></div>

            <p onclick="logout()" style="text-align:center; font-size:11px; color:var(--gray); cursor:pointer; margin-top:30px;">Logout / Reset App</p>
        </div>
    </div>

<script>
    let activeTopics = [];

    function sel(el, name) {
        el.classList.toggle('active');
        if(activeTopics.includes(name)) {
            activeTopics = activeTopics.filter(t => t !== name);
        } else { activeTopics.push(name); }
    }

    function saveKey() {
        const val = document.getElementById('hfToken').value.trim();
        if(val.startsWith('hf_')) {
            localStorage.setItem('globe_key', val);
            init();
        } else { alert("Token must start with hf_"); }
    }

    function logout() { localStorage.clear(); location.reload(); }

    function init() {
        if(localStorage.getItem('globe_key')) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
        }
    }

    async function fetchNews() {
        if(activeTopics.length === 0) return alert("Tap a story circle first!");
        
        const feed = document.getElementById('feed');
        const status = document.getElementById('status');
        const debug = document.getElementById('debug');
        const token = localStorage.getItem('globe_key');

        status.innerText = "Connecting to Satellite...";
        debug.innerText = "";

        // 2026 ROUTER ENDPOINT
        const apiTarget = "https://router.huggingface.co/hf-inference/v1/chat/completions";
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(apiTarget)}`;

        try {
            const response = await fetch(proxyUrl, {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "mistralai/Mistral-7B-Instruct-v0.2",
                    messages: [
                        { role: "user", content: `Generate 3 short, exciting news updates for teenagers about ${activeTopics.join(" and ")}. Use emojis.` }
                    ],
                    max_tokens: 500
                })
            });

            const data = await response.json();

            if (response.ok) {
                const content = data.choices[0].message.content;
                // Split by double newlines or numbered lists
                const items = content.split(/\n\d\.|\n\n/).filter(t => t.trim().length > 10);
                
                feed.innerHTML = "";
                items.forEach(text => {
                    feed.innerHTML += `
                        <div class="post">
                            <div class="p-header"><div class="avatar">DG</div> dailyglobe_official</div>
                            <div class="p-content">${text.trim()}</div>
                            <div class="p-actions">❤️ 💬 🚀</div>
                            <div class="p-likes">${Math.floor(Math.random()*2000)+50} likes</div>
                        </div>
                    `;
                });
                status.innerText = "Feed Updated";
            } else {
                status.innerText = "API Error";
                debug.innerText = data.error?.message || "Check your token permissions.";
            }
        } catch (e) {
            status.innerText = "Network Blocked";
            debug.innerText = "Check your connection or use Incognito mode.";
        }
    }

    init();
</script>
</body>
</html>
