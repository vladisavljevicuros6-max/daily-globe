<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Daily Globe</title>
    <style>
        :root { --bg: #f2f2f7; --card: #ffffff; --tint: #007aff; --text: #1c1c1e; }
        [data-theme="dark"] { --bg: #000; --card: #1c1c1e; --text: #fff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 450px; margin: 0 auto; }
        h1 { font-size: 38px; font-weight: 900; color: var(--tint); text-align: center; letter-spacing: -1.5px; }
        .card { background: var(--card); border-radius: 24px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .chip { background: var(--bg); padding: 16px; border-radius: 15px; text-align: center; font-weight: 700; cursor: pointer; border: 2px solid transparent; }
        .chip.active { border-color: var(--tint); background: rgba(0,122,255,0.1); color: var(--tint); }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #eee; margin: 15px 0; box-sizing: border-box; }
        button.action { background: var(--tint); color: white; border: none; width: 100%; padding: 20px; border-radius: 18px; font-size: 18px; font-weight: 800; cursor: pointer; }
        #status { text-align: center; margin-top: 15px; font-size: 14px; font-weight: 700; color: var(--tint); }
        #output { display: none; line-height: 1.6; font-size: 17px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Daily Globe</h1>

    <div id="setup" class="card">
        <p style="text-align:center; font-weight:700;">Enter Hugging Face Token</p>
        <input type="password" id="keyInput" placeholder="hf_...">
        <button class="action" onclick="saveKey()">Connect</button>
    </div>

    <div id="app" style="display:none;">
        <div class="card">
            <div class="grid">
                <div class="chip" onclick="this.classList.toggle('active')">Science</div>
                <div class="chip" onclick="this.classList.toggle('active')">Sport</div>
                <div class="chip" onclick="this.classList.toggle('active')">Tech</div>
                <div class="chip" onclick="this.chip.toggle('active')">Cars</div>
            </div>
            <button class="action" onclick="generate()">Generate Report</button>
            <div id="status">Ready</div>
        </div>
        <div id="output" class="card"></div>
    </div>
</div>

<script>
    function saveKey() {
        const k = document.getElementById('keyInput').value.trim();
        if(k.startsWith('hf_')) {
            localStorage.setItem('dg_key', k);
            init();
        } else { alert("Must start with hf_"); }
    }

    function init() {
        if(localStorage.getItem('dg_key')) {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }
    }

    async function generate() {
        const topics = Array.from(document.querySelectorAll('.chip.active')).map(c => c.innerText);
        if(!topics.length) return alert("Pick a topic!");

        const status = document.getElementById('status');
        const output = document.getElementById('output');
        status.innerText = "Connecting...";

        try {
            // Switched to 'Phi-3' which is more CORS-friendly for web apps
            const response = await fetch("https://api-inference.huggingface.co/models/microsoft/Phi-3-mini-4k-instruct", {
                headers: { 
                    "Authorization": "Bearer " + localStorage.getItem('dg_key').trim(),
                    "Content-Type": "application/json"
                },
                method: "POST",
                body: JSON.stringify({ 
                    inputs: "Write a short teen news report about: " + topics.join(", "),
                    parameters: { max_new_tokens: 300 }
                }),
            });

            const result = await response.json();

            if (result.error) {
                status.innerText = "AI is loading... try again in 10s";
                return;
            }

            const text = result[0].generated_text || result.generated_text;
            output.innerHTML = text.replace(/\n/g, '<br>');
            output.style.display = "block";
            status.innerText = "Done!";

        } catch (e) {
            status.innerText = "CORS Error - Try a different browser or turn off AdBlock";
            console.error(e);
        }
    }

    init();
</script>
</body>
</html>
