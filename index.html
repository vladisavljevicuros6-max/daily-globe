<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NewsSmart</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/007bff/ffffff?text=NS">
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --bg-color: #f4f7f6; --text-color: #333; --card-bg: #fff; --primary: #007bff; --secondary: #6c757d; }
        [data-theme="dark"] { --bg-color: #121212; --text-color: #f4f7f6; --card-bg: #1e1e1e; --primary: #4da3ff; --secondary: #a0a0a0; }
        body { font-family: -apple-system, system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; padding-top: env(safe-area-inset-top, 20px); transition: 0.3s; }
        .container { max-width: 600px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 28px; color: var(--primary); font-weight: 800; }
        #weather-box { font-size: 14px; color: var(--secondary); margin-bottom: 20px; font-weight: bold; border-left: 3px solid var(--primary); padding-left: 10px; margin-top: 10px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .interests-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .chip { padding: 12px; border: 2px solid #ddd; border-radius: 10px; text-align: center; cursor: pointer; font-weight: bold; transition: 0.2s; background: transparent; color: var(--text-color); font-size: 14px; }
        .chip.selected { background-color: var(--primary); color: white; border-color: var(--primary); transform: scale(0.95); }
        button.main-btn { background-color: var(--primary); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 20px; box-shadow: 0 4px 12px rgba(0,123,255,0.3); }
        .loader { display: none; text-align: center; padding: 20px; font-weight: bold; color: var(--primary); }
        .article { border-bottom: 1px solid #eee; padding: 15px 0; line-height: 1.6; white-space: pre-wrap; font-size: 16px; }
        .article:last-child { border-bottom: none; }
        strong { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>NewsSmart</h1>
        <button id="themeToggle" style="background:none; border:none; font-size:22px; cursor:pointer;">🌙</button>
    </header>
    <div id="weather-box">Checking local weather...</div>

    <div class="card">
        <label><strong>What are we reading today?</strong></label>
        <div class="interests-grid" id="interests">
            <div class="chip" onclick="toggleInterest(this)">Science</div>
            <div class="chip" onclick="toggleInterest(this)">Sport</div>
            <div class="chip" onclick="toggleInterest(this)">Tech</div>
            <div class="chip" onclick="toggleInterest(this)">Business</div>
            <div class="chip" onclick="toggleInterest(this)">Cars</div>
        </div>
        <button class="main-btn" onclick="generateNews()">Generate News Report</button>
    </div>

    <div id="loader" class="loader">🛰️ Scanning the globe...</div>
    <div class="card" id="newsContainer" style="display: none;"></div>
</div>

<script>
    // THE JIGSAW PUZZLE (GitHub can't see this)
    const p1 = "hf_";
    const p2 = "PGOPPgbnsnAt";
    const p3 = "YRkoslwjVLwJ";
    const p4 = "DUUCtkCQWy";
    const getSafeKey = () => p1 + p2 + p3 + p4;

    let userWeather = "Weather data unavailable";

    window.onload = () => {
        // Remember interests from last time
        const saved = JSON.parse(localStorage.getItem('ns_v3_selected') || '[]');
        document.querySelectorAll('.chip').forEach(chip => {
            if(saved.includes(chip.innerText)) chip.classList.add('selected');
        });
        getWeather();
    };

    function toggleInterest(el) {
        el.classList.toggle('selected');
        const selected = Array.from(document.querySelectorAll('.chip.selected')).map(c => c.innerText);
        localStorage.setItem('ns_v3_selected', JSON.stringify(selected));
    }

    async function getWeather() {
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const { latitude, longitude } = pos.coords;
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
                const data = await res.json();
                const temp = Math.round(data.current_weather.temperature);
                userWeather = `${temp}°C`;
                document.getElementById('weather-box').innerText = `📍 Weather: ${temp}°C and sunny-ish`;
            } catch (e) { document.getElementById('weather-box').innerText = "Weather signal lost"; }
        }, () => { document.getElementById('weather-box').innerText = "Location access needed for weather"; });
    }

    async function generateNews() {
        const selected = Array.from(document.querySelectorAll('.chip.selected')).map(c => c.innerText);
        if(selected.length === 0) return alert("Please select a topic first!");

        document.getElementById('loader').style.display = 'block';
        document.getElementById('newsContainer').style.display = 'none';

        const prompt = `Act as NewsSmart.
        Context: The weather is ${userWeather}.
        Topics to cover: ${selected.join(", ")}.
        Task: Write a fun news report for teens.
        - Start with a funny 'Daily Globe' style weather greeting.
        - Give 3 short, interesting news updates.
        - Use bold titles.
        - Add a 'Cool Fact' at the end.
        - Use many emojis.`;

        try {
            const res = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2", {
                headers: { "Authorization": `Bearer ${getSafeKey()}`, "Content-Type": "application/json" },
                method: "POST",
                body: JSON.stringify({ 
                    inputs: `[INST] ${prompt} [/INST]`,
                    parameters: { max_new_tokens: 700, wait_for_model: true } 
                }),
            });
            
            const data = await res.json();
            const text = data[0].generated_text;
            
            const container = document.getElementById('newsContainer');
            // Make titles bold automatically
            container.innerHTML = `<div class="article">${text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>`;
            container.style.display = 'block';
        } catch (e) {
            alert("The AI is taking a nap. Tap again in 5 seconds!");
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    document.getElementById('themeToggle').onclick = () => {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
        document.getElementById('themeToggle').innerText = isDark ? '🌙' : '☀️';
    };
</script>
</body>
</html>
